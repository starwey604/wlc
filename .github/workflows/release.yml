name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (required for publication; optional for rehearsal)
        type: string
      source_ref:
        description: Compiler source ref (rehearsal or promotion without an existing tag)
        type: string
      wirelink_ref:
        description: Exact Wirelink candidate (empty uses the qualified API baseline)
        type: string
      dry_run:
        description: Verify and assemble artifacts without creating a tag or release
        type: boolean
        default: false
      promote_run:
        description: Successful rehearsal run whose exact bundle should be promoted
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: wlc-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ inputs.source_ref || inputs.tag || github.sha }}
      wirelink_ref: ${{ inputs.wirelink_ref }}
      release_tag: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      require_tag: ${{ github.event_name == 'push' || !inputs.dry_run }}
      run_tests: ${{ !inputs.promote_run }}
  package:
    name: Package ${{ matrix.asset }}
    needs: verify
    if: ${{ !inputs.promote_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: wlc-windows-x86_64
            archive: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: wlc-linux-x86_64-musl
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: wlc-linux-aarch64-musl
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: wlc-macos-x86_64
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            asset: wlc-macos-aarch64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          repository: starwey604/wlc
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/checkout@v7
        with:
          repository: starwey604/wirelink
          ref: ${{ needs.verify.outputs.wirelink_sha }}
          path: .tools/wirelink
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install qualified Rust target
        run: rustup toolchain install 1.96.1 --profile minimal --target ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release binary
        run: cargo +1.96.1 build --locked --release --target ${{ matrix.target }}
      - name: Create platform archive with provenance
        run: >-
          python .github/scripts/release.py pack
          --wirelink .tools/wirelink --run-id "$GITHUB_RUN_ID"
          --asset ${{ matrix.asset }}
          --binary target/${{ matrix.target }}/release/wlc${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Exercise the extracted archive against the paired installed core
        run: >-
          python .github/scripts/release.py smoke
          --wirelink .tools/wirelink --run-id "$GITHUB_RUN_ID"
          --archive dist/${{ matrix.asset }}.${{ matrix.archive }}
          --work target/archive-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.${{ matrix.archive }}
          if-no-files-found: error
  assemble:
    name: Verify release bundle
    needs: [verify, package]
    if: ${{ always() && needs.verify.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: starwey604/wlc
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/checkout@v7
        with:
          repository: starwey604/wirelink
          ref: ${{ needs.verify.outputs.wirelink_sha }}
          path: .tools/wirelink
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.promote_run }}
        with:
          pattern: wlc-*
          path: artifacts
      - name: Collect all five tested archives
        if: ${{ !inputs.promote_run }}
        run: python .github/scripts/release.py collect --wirelink .tools/wirelink --run-id "$GITHUB_RUN_ID" --artifacts artifacts
      - uses: actions/download-artifact@v4
        if: ${{ inputs.promote_run }}
        with:
          name: wlc-release-bundle
          run-id: ${{ inputs.promote_run }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify integrity and promotion provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_RUN: ${{ inputs.promote_run }}
        run: >-
          python .github/scripts/release.py verify --wirelink .tools/wirelink
          --run-id "$GITHUB_RUN_ID" --promote-run "$PROMOTE_RUN"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.promote_run }}
        with:
          name: wlc-release-bundle
          path: dist/*
          if-no-files-found: error
  publish:
    name: Publish verified bundle
    needs: [verify, assemble]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.assemble.result == 'success' && (github.event_name == 'push' || !inputs.dry_run) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: starwey604/wlc
          ref: ${{ needs.verify.outputs.source_sha }}
      - uses: actions/checkout@v7
        with:
          repository: starwey604/wirelink
          ref: ${{ needs.verify.outputs.wirelink_sha }}
          path: .tools/wirelink
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wlc-release-bundle
          run-id: ${{ inputs.promote_run || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Publish exact assets without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PROMOTE_RUN: ${{ inputs.promote_run }}
        run: >-
          python .github/scripts/release.py verify --wirelink .tools/wirelink
          --run-id "$GITHUB_RUN_ID" --promote-run "$PROMOTE_RUN" --tag "$RELEASE_TAG" --publish
