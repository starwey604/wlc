name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality and generated C
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Wirelink test dependency
        uses: actions/checkout@v7
        with:
          repository: starwey604/wirelink
          ref: a8db9879f8aa4f74e9d2b01746ad3b9e6bad6b92
          path: wirelink

      - name: Check out wlc
        uses: actions/checkout@v7
        with:
          path: wirelink/wlc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        working-directory: wirelink/wlc
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: wirelink/wlc
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: wirelink/wlc
        run: cargo test --locked

  host-smoke:
    name: Host smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out wlc
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build host compiler
        run: cargo build --locked

      - name: Run portable CLI tests
        run: cargo test --locked --test cli
