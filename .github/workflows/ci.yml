name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      wirelink_ref:
        description: Wirelink branch or ref (defaults to the paired commit)
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality and generated C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: starwey604/wirelink
          ref: ${{ inputs.wirelink_ref || 'aeefac198f1fd01af689a6949a52c260254e6785' }}
          path: wirelink
      - uses: actions/checkout@v7
        with:
          path: wirelink/wlc
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check compiler and generated C
        working-directory: wirelink/wlc
        run: |
          cargo +stable fmt --all --check
          cargo +stable clippy --locked --all-targets --all-features -- -D warnings
          cargo +stable test --locked
